name: Portfolio CI & Production Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Types
        run: npx tsc --noEmit

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Dist Output Directory
        run: test -d dist && echo "Build directory verified."
